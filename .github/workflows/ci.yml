name: ci

on:
  push:
  pull_request:

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build (CGO_ENABLED=0)
        run: go build ./...

  no-cgo-lint:
    name: lint: no cgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid import "C"
        shell: bash
        run: |
          if grep -rn --include='*.go' -E 'import[[:space:]]+"C"' .; then
            echo "::error::cgo is forbidden (CGO_ENABLED=0)"
            exit 1
          fi
          echo "ok: no cgo"

  schema:
    name: schema regen diff (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: placeholder
        run: echo "placeholder — lit up in stage 1 (codegen: regen diff must be empty)"
